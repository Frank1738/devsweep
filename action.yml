name: devsweep
description: Find supply-chain and credential risks in a repository and report them to GitHub code scanning.
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Folder to scan, relative to the workspace.
    required: false
    default: .
  fail-on:
    description: Fail the step when a finding is at or above this severity (critical, high, medium, low or none).
    required: false
    default: low
  sarif-file:
    description: Where to write the SARIF report, relative to the workspace.
    required: false
    default: devsweep.sarif

outputs:
  sarif-file:
    description: Path of the SARIF report, for github/codeql-action/upload-sarif.

runs:
  using: node24
  main: action/main.mjs
