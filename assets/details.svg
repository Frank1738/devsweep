<svg xmlns="http://www.w3.org/2000/svg" width="916" height="544" viewBox="0 0 916 544" role="img" aria-labelledby="title">
<title id="title">Two findings from devsweep --details. Each one explains the risk, shows the lines of the workflow involved with the problem underlined, gives the fix, and names the rule that found it.</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;font-size:14px;white-space:pre}
.title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12.5px;fill:#8b949e}

</style>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010409" flood-opacity=".28"/></filter>
<clipPath id="window"><rect x="18" y="18" width="880" height="508" rx="10"/></clipPath>
</defs>
<rect x="18" y="18" width="880" height="508" rx="10" fill="#0f1319" filter="url(#shadow)"/>
<rect x="18" y="18" width="880" height="508" rx="10" fill="#0f1319"/>
<g clip-path="url(#window)">
<rect x="18" y="18" width="880" height="34" fill="#161b23"/>
<rect x="18" y="51" width="880" height="1" fill="#2a313c"/>
</g>
<circle cx="38" cy="35" r="6" fill="#ff5f57"/>
<circle cx="58" cy="35" r="6" fill="#febc2e"/>
<circle cx="78" cy="35" r="6" fill="#28c840"/>
<text class="title" x="458" y="39" text-anchor="middle">devsweep --details</text>
<rect x="18.5" y="18.5" width="879" height="507" rx="9.5" fill="none" stroke="#2a313c"/>
<g transform="translate(38 68)" fill="#c9d1d9">
<text x="16.8" y="12.5" textLength="151.2" lengthAdjust="spacing" fill-opacity=".55">.github/workflows/</text><text x="168" y="12.5" textLength="117.6" lengthAdjust="spacing" font-weight="700">pr-preview.yml</text>

<circle cx="37.8" cy="42.5" r="3.6" fill="#ff7b72"/><text x="50.4" y="46.5" textLength="67.2" lengthAdjust="spacing" fill="#ff7b72" font-weight="700">critical</text><text x="134.4" y="46.5" textLength="294" lengthAdjust="spacing" font-weight="700">Runs pull request code with secrets</text><text x="445.2" y="46.5" textLength="58.8" lengthAdjust="spacing" fill-opacity=".55">line 14</text>
<text x="50.4" y="63.5" textLength="546" lengthAdjust="spacing">Job "preview" runs on pull_request_target and checks out ref "${{</text>
<text x="50.4" y="80.5" textLength="772.8" lengthAdjust="spacing">github.event.pull_request.head.sha }}", so code from any fork can run with this repository's</text>
<text x="50.4" y="97.5" textLength="201.6" lengthAdjust="spacing">secrets and write token.</text>

<text x="50.4" y="131.5" textLength="16.8" lengthAdjust="spacing" fill-opacity=".55">13</text><path d="M79.8 119L79.8 136" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="159.6" y="131.5" textLength="42" lengthAdjust="spacing" fill-opacity=".55">with:</text>
<text x="50.4" y="148.5" textLength="16.8" lengthAdjust="spacing" fill-opacity=".55">14</text><path d="M79.8 136L79.8 153" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="176.4" y="148.5" textLength="386.4" lengthAdjust="spacing">ref: ${{ github.event.pull_request.head.sha }}</text>
<path d="M79.8 153L79.8 170" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="218.4" y="165.5" textLength="344.4" lengthAdjust="spacing" fill="#ff7b72" font-weight="700">^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^</text>

<text x="50.4" y="199.5" textLength="33.6" lengthAdjust="spacing" fill="#7ee787">Fix:</text><text x="92.4" y="199.5" textLength="672" lengthAdjust="spacing">Switch to the pull_request trigger, or split the work: build untrusted code in a</text>
<text x="50.4" y="216.5" textLength="747.6" lengthAdjust="spacing">pull_request workflow with no secrets, then act on its results in a separate workflow_run</text>
<text x="50.4" y="233.5" textLength="75.6" lengthAdjust="spacing">workflow.</text>
<text x="50.4" y="250.5" textLength="226.8" lengthAdjust="spacing" fill-opacity=".55">workflow/untrusted-checkout</text>

<circle cx="37.8" cy="280.5" r="3.6" fill="#ff7b72"/><text x="50.4" y="284.5" textLength="33.6" lengthAdjust="spacing" fill="#ff7b72">high</text><text x="100.8" y="284.5" textLength="126" lengthAdjust="spacing" font-weight="700">Unpinned action</text><text x="243.6" y="284.5" textLength="58.8" lengthAdjust="spacing" fill-opacity=".55">line 16</text>
<text x="50.4" y="301.5" textLength="772.8" lengthAdjust="spacing">Third-party action "example-org/deploy-preview" is pinned to "v2", a tag or branch its owner</text>
<text x="50.4" y="318.5" textLength="75.6" lengthAdjust="spacing">can move.</text>

<text x="50.4" y="352.5" textLength="16.8" lengthAdjust="spacing" fill-opacity=".55">15</text><path d="M79.8 340L79.8 357" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="142.8" y="352.5" textLength="252" lengthAdjust="spacing" fill-opacity=".55">- run: npm ci &amp;&amp; npm run build</text>
<text x="50.4" y="369.5" textLength="16.8" lengthAdjust="spacing" fill-opacity=".55">16</text><path d="M79.8 357L79.8 374" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="142.8" y="369.5" textLength="310.8" lengthAdjust="spacing">- uses: example-org/deploy-preview@v2</text>
<path d="M79.8 374L79.8 391" fill="none" stroke="#c9d1d9" stroke-width="1.1" stroke-opacity=".55"/><text x="210" y="386.5" textLength="243.6" lengthAdjust="spacing" fill="#ff7b72">^^^^^^^^^^^^^^^^^^^^^^^^^^^^^</text>

<text x="50.4" y="420.5" textLength="33.6" lengthAdjust="spacing" fill="#7ee787">Fix:</text><text x="92.4" y="420.5" textLength="714" lengthAdjust="spacing">Pin it to a full commit SHA: uses: example-org/deploy-preview@&lt;40-character-sha&gt; # v2</text>
<text x="50.4" y="437.5" textLength="201.6" lengthAdjust="spacing" fill-opacity=".55">workflow/unpinned-action</text>
</g>
</svg>
