<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title">
<title id="title">How devsweep works. It reads workflow files from the folder you scan, and repository settings from the GitHub API (this needs a token and is skipped with --offline). It runs 8 rules, 6 for workflows and 2 for repository settings, adjusted by devsweep.config.json. It gives back a readable report, an exit code (0 pass, 1 findings, 2 error), JSON with --json, and SARIF with --sarif for the GitHub Security tab.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e;font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:12px}
.head{font-size:11px;font-weight:600;letter-spacing:.12em;fill:#6e7681}
.name{font-size:14px;font-weight:600;fill:#e6edf3}
.box{fill:#161b23;stroke:#2a313c}
.wire{fill:none;stroke:#4b535d;stroke-width:1.5}
</style>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010409" flood-opacity=".28"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#6e7681"/></marker>
<linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eeeeee"/><stop offset="1" stop-color="#a8a8a8"/></linearGradient>
</defs>

<!-- Card -->
<rect x="18" y="18" width="864" height="384" rx="12" fill="#0f1319" filter="url(#shadow)"/>
<rect x="18" y="18" width="864" height="384" rx="12" fill="#0f1319"/>
<rect x="18.5" y="18.5" width="863" height="383" rx="11.5" fill="none" stroke="#2a313c"/>

<!-- A few stars, as in the terminal banner -->
<g fill="#6e7681">
<circle cx="372" cy="44" r=".9"/><circle cx="411" cy="58" r="1.1" fill="#d0d0d0"/><circle cx="455" cy="40" r=".8"/><circle cx="497" cy="66" r="1"/><circle cx="531" cy="47" r=".8" fill="#afd7ff"/><circle cx="569" cy="72" r=".9"/><circle cx="352" cy="82" r=".8"/><circle cx="548" cy="90" r="1.1" fill="#bcbcbc"/>
<circle cx="604" cy="378" r=".9"/><circle cx="662" cy="386" r="1.1" fill="#d0d0d0"/><circle cx="725" cy="374" r=".8"/><circle cx="790" cy="388" r="1" fill="#d7afff"/><circle cx="846" cy="372" r=".8"/><circle cx="62" cy="384" r=".9"/><circle cx="118" cy="372" r="1"/><circle cx="196" cy="388" r=".8"/>
</g>

<!-- Column headings -->
<text class="head" x="48" y="56">WHAT IT READS</text>
<text class="head" x="622" y="56">WHAT YOU GET</text>

<!-- Inputs -->
<rect class="box" x="48" y="72" width="250" height="96" rx="8"/>
<text class="name" x="66" y="100">Workflow files</text>
<text class="mono" x="66" y="124" fill="#c9d1d9">.github/workflows/*.yml</text>
<text x="66" y="148">Read from the folder you scan</text>

<rect class="box" x="48" y="188" width="250" height="136" rx="8"/>
<text class="name" x="66" y="216">Repository settings on GitHub</text>
<text x="66" y="240">Rulesets, branch protection and</text>
<text x="66" y="258">recent force pushes</text>
<text x="66" y="286">Read through the GitHub API with</text>
<text x="66" y="304">a token. <tspan class="mono" fill="#c9d1d9">--offline</tspan> skips them.</text>

<!-- devsweep -->
<rect x="360" y="112" width="200" height="150" rx="10" fill="#56d4dd" opacity=".16" filter="url(#glow)"/>
<rect x="360" y="112" width="200" height="150" rx="10" fill="#121a22" stroke="#56d4dd" stroke-opacity=".75"/>
<text class="mono" x="460" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="url(#word)" style="font-size:22px">devsweep</text>
<text class="name" x="460" y="194" text-anchor="middle">8 rules</text>
<text x="460" y="216" text-anchor="middle">6 for workflows</text>
<text x="460" y="234" text-anchor="middle">2 for repository settings</text>

<rect class="box" x="360" y="300" width="200" height="72" rx="8" stroke-dasharray="4 3"/>
<text class="mono" x="460" y="326" text-anchor="middle" fill="#c9d1d9">devsweep.config.json</text>
<text x="460" y="346" text-anchor="middle">Accepted findings and</text>
<text x="460" y="362" text-anchor="middle">severity changes (optional)</text>

<!-- Outputs -->
<rect class="box" x="622" y="72" width="230" height="58" rx="8"/>
<text class="name" x="640" y="96">Readable report</text>
<text x="640" y="117">In your terminal or CI log</text>

<rect class="box" x="622" y="142" width="230" height="58" rx="8"/>
<text class="name" x="640" y="166">Exit code</text>
<text x="640" y="187"><tspan fill="#7ee787">0</tspan> pass · <tspan fill="#ff7b72">1</tspan> findings · <tspan fill="#e3b341">2</tspan> error</text>

<rect class="box" x="622" y="212" width="230" height="58" rx="8"/>
<text class="name" x="640" y="236">JSON</text>
<text x="640" y="257"><tspan class="mono" fill="#c9d1d9">--json</tspan>, for scripts</text>

<rect class="box" x="622" y="282" width="230" height="58" rx="8"/>
<text class="name" x="640" y="306">SARIF</text>
<text x="640" y="327"><tspan class="mono" fill="#c9d1d9">--sarif</tspan>, for GitHub's Security tab</text>

<!-- Wires -->
<path class="wire" d="M298 120C330 120 330 162 358 162" marker-end="url(#arrow)"/>
<path class="wire" d="M298 256C330 256 330 214 358 214" marker-end="url(#arrow)"/>
<path class="wire" d="M460 300V265" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path class="wire" d="M560 170C592 170 590 101 620 101" marker-end="url(#arrow)"/>
<path class="wire" d="M560 182C592 182 590 171 620 171" marker-end="url(#arrow)"/>
<path class="wire" d="M560 194C592 194 590 241 620 241" marker-end="url(#arrow)"/>
<path class="wire" d="M560 206C592 206 590 311 620 311" marker-end="url(#arrow)"/>
</svg>
